# Optional: keep the gspca_kinect kernel driver off the Kinect camera.
#
# gspca_kinect serves the Kinect camera as a V4L2 device (/dev/videoN).
# libfreenect does not need this: it detaches the driver when it opens the
# camera and re-attaches it when it closes it. Use this file only if you
# never want the V4L2 device, for example so that other programs cannot hold
# the camera open while a libfreenect application is starting.
#
# To use it: copy it to /etc/modprobe.d/, uncomment the line below, and run
#   sudo modprobe -r gspca_kinect
#
#blacklist gspca_kinect
