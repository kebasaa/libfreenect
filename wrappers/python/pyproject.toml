[build-system]
requires = ["scikit-build-core>=0.10", "cython>=3.0", "numpy>=1.25"]
build-backend = "scikit_build_core.build"

[project]
name = "freenect"
version = "0.7.5"
description = "Python bindings for libfreenect (Kinect v1): streams, motor and LED, coordinate mapping, microphone array beamforming, skeleton, hand and gesture tracking"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0 OR GPL-2.0-only" }
dependencies = ["numpy>=1.25"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Cython",
  "Topic :: Multimedia :: Video :: Capture",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.urls]
Homepage = "https://github.com/OpenKinect/libfreenect"

[tool.scikit-build]
minimum-version = "build-system.requires"
# only the Python modules (and libusb's DLL on Windows), not libfreenect's own install
install.components = ["python"]
wheel.packages = []
build-dir = "build/{wheel_tag}"
# The package builds libfreenect from the repository around it, so build it
# from a checkout (uv pip install ./wrappers/python), not from an sdist.
sdist.include = []

[tool.scikit-build.cmake.define]
FREENECT_PYTHON_NUI = "ON"
